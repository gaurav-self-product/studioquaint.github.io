<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Detail | Studio Quaint</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        #pano-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            opacity: 0;
            visibility: hidden;
            background: #000;
            transition: opacity 0.8s ease;
        }

        #pano-container.active {
            opacity: 1;
            visibility: visible;
        }

        .hero-project {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .hero-project::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
        }

        .project-content {
            position: relative;
            z-index: 5;
            max-width: 800px;
            padding: 2rem;
        }

        .btn-360 {
            margin-top: 2rem;
            cursor: pointer;
            border: 1px solid white;
            padding: 1rem 2rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            color: white;
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .btn-360:hover {
            background: white;
            color: black;
        }

        #close-pano {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 100;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.5);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
        }

        /* Photo Gallery Styles */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            grid-auto-rows: 250px;
            grid-auto-flow: dense;
            gap: 1.5rem;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            filter: grayscale(10%) brightness(95%);
        }

        .gallery-item:hover img {
            transform: scale(1.05);
            filter: grayscale(0%) brightness(100%);
        }

        .gallery-item.wide {
            grid-column: span 2;
        }

        .gallery-item.tall {
            grid-row: span 2;
        }

        .gallery-item.big {
            grid-column: span 2;
            grid-row: span 2;
        }

        /* Lightbox styling */
        #lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(18, 18, 18, 0.98);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            backdrop-filter: blur(10px);
        }

        #lightbox.active {
            opacity: 1;
            visibility: visible;
        }

        .lightbox-content {
            max-width: 90%;
            max-height: 85vh;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lightbox-img {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform: scale(0.95);
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        #lightbox.active .lightbox-img {
            transform: scale(1);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1.5rem;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s ease;
        }

        .lightbox-nav:hover {
            background: white;
            color: black;
            transform: translateY(-50%) scale(1.05);
        }

        .lightbox-prev {
            left: -80px;
        }

        .lightbox-next {
            right: -80px;
        }

        .lightbox-close {
            position: absolute;
            top: -60px;
            right: 0;
            color: rgba(255, 255, 255, 0.7);
            font-size: 2rem;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .lightbox-close:hover {
            color: white;
        }

        .lightbox-counter {
            color: rgba(255, 255, 255, 0.5);
            font-family: var(--font-body);
            font-size: 0.9rem;
            margin-top: 1rem;
            letter-spacing: 2px;
        }

        @media (max-width: 900px) {
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                grid-auto-rows: 200px;
                gap: 1rem;
            }
            .gallery-item.wide, .gallery-item.big {
                grid-column: span 1;
            }
            .gallery-item.tall, .gallery-item.big {
                grid-row: span 1;
            }
            .lightbox-prev {
                left: 10px;
            }
            .lightbox-next {
                right: 10px;
            }
            .lightbox-nav {
                background: rgba(0, 0, 0, 0.6);
                width: 45px;
                height: 45px;
                font-size: 1.2rem;
            }
            .lightbox-close {
                top: -50px;
                right: 10px;
            }
        }
    </style>
</head>

<body>

    <header id="main-header">
        <div class="container">
            <nav>
                <a href="index.html" class="logo-link">
                    <img src="assets/svg/StudioQuaint/OnlyLogo_white.svg" alt="Studio Quaint" class="logo">
                </a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="projects.html">Projects</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="project-main">
        <section id="hero-section" class="hero-project">
            <div class="project-content">
                <p id="proj-meta" style="font-size: 0.9rem; letter-spacing: 3px; margin-bottom: 1rem;"></p>
                <h1 id="proj-title" style="font-family: 'Playfair Display'; font-size: 4rem; margin-bottom: 1.5rem;">
                    Loading...</h1>
                <p id="proj-desc"
                    style="font-size: 1.1rem; line-height: 1.6; max-width: 600px; margin: 0 auto; opacity: 0.8;"></p>

                <div id="cta-container">
                    <button id="start-360" class="btn-360" style="display: none;">Enter 360 Experience</button>
                    <p id="status-360" style="margin-top: 1rem; font-size: 0.8rem; opacity: 0.6; display: none;">
                        Preparing 360 viewer...</p>
                </div>
            </div>
        </section>

        <!-- Gallery Section -->
        <section id="gallery-section" class="container mt-lg mb-lg" style="display: none; padding-top: 2rem;">
            <h2 class="section-title text-center mb-lg" style="font-family: var(--font-heading); font-size: 2.5rem; letter-spacing: 1px; color: var(--text-color);">Project Gallery</h2>
            <div id="gallery-grid" class="gallery-grid"></div>
        </section>
    </main>

    <footer style="padding: 4rem 0 2rem 0; background: #fafafa;">
        <div class="container">
            <div
                style="border-top: 1px solid rgba(0,0,0,0.1); padding-top: 2rem; text-align: center; color: var(--text-light); font-size: 0.8rem;">
                <p style="margin-bottom: 0.5rem; color: var(--accent-color); font-weight: 500;">SITE UNDER CONSTRUCTION
                    — CONTENT FOR DEMONSTRATION PURPOSES</p>
                &copy; 2026 Studio Quaint. All rights reserved.
            </div>
        </div>
    </footer>

    <div id="pano-container"></div>
    <div id="close-pano">&times;</div>

    <!-- Lightbox Markup -->
    <div id="lightbox">
        <div class="lightbox-content">
            <span class="lightbox-close">&times;</span>
            <img class="lightbox-img" src="" alt="Detail Gallery Image">
            <span class="lightbox-nav lightbox-prev">&larr;</span>
            <span class="lightbox-nav lightbox-next">&rarr;</span>
            <span class="lightbox-counter">1 / 1</span>
        </div>
    </div>

    <!-- Vendor Scripts -->
    <script src="js/vendor/bowser.min.js"></script>
    <script src="js/vendor/screenfull.min.js"></script>
    <script src="js/vendor/marzipano.js"></script>

    <!-- App Logic -->
    <script src="js/PanoManager.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const projectId = urlParams.get('id');
            const pano = new PanoManager('pano-container');
            let panoInitialized = false;

            if (!projectId) {
                window.location.href = 'projects.html';
                return;
            }

            try {
                // 1. Fetch registry data
                const registryResp = await fetch('assets/projects/registry.json');
                const registry = await registryResp.json();
                const project = registry.find(p => p.id === projectId);

                if (!project) throw new Error("Project not found");

                // 2. Populate UI
                document.getElementById('proj-title').textContent = project.title;
                document.getElementById('proj-desc').textContent = project.description;
                document.getElementById('proj-meta').textContent = `${project.location} · ${project.year}`;
                
                const isAbsoluteUrl = project.thumbnail.startsWith('http://') || project.thumbnail.startsWith('https://') || project.thumbnail.startsWith('//');
                const bgUrl = isAbsoluteUrl ? project.thumbnail : `assets/projects/${projectId}/${project.thumbnail}`;
                document.getElementById('hero-section').style.backgroundImage = `url('${bgUrl}')`;

                // 3. Early initialization of 360 viewer (Pre-warm)
                if (project.has360) {
                    const statusEl = document.getElementById('status-360');
                    const btnEl = document.getElementById('start-360');

                    statusEl.style.display = 'block';

                    // Fire-and-forget init
                    pano.init(projectId).then(success => {
                        statusEl.style.display = 'none';
                        if (success) {
                            panoInitialized = true;
                            btnEl.style.display = 'inline-block';
                        } else {
                            console.error("360 failed to initialize. Check console for PanoManager errors.");
                        }
                    }).catch(err => {
                        console.error("Critical error during 360 init:", err);
                        statusEl.style.display = 'none';
                    });

                    // Handle button click (Direct User Gesture)
                    btnEl.addEventListener('click', () => {
                        if (!panoInitialized) return;

                        // Immediate Fullscreen (Chrome requires this at top of click)
                        if (window.screenfull && screenfull.enabled) {
                            screenfull.request().catch(e => console.warn("Fullscreen request blocked:", e));
                        }

                        // Show viewer
                        document.getElementById('pano-container').classList.add('active');
                        document.getElementById('close-pano').style.display = 'flex';
                        document.getElementById('main-header').style.display = 'none';
                    });
                }

                // 4. Populate Gallery if images list is present
                if (project.images && project.images.length > 0) {
                    const gallerySec = document.getElementById('gallery-section');
                    const galleryGrid = document.getElementById('gallery-grid');
                    galleryGrid.innerHTML = '';
                    
                    project.images.forEach((imgRelPath, index) => {
                        const item = document.createElement('div');
                        item.className = 'gallery-item fade-in';
                        
                        // Assign shapes based on index patterns
                        if (index % 7 === 1) {
                            item.classList.add('tall');
                        } else if (index % 7 === 3) {
                            item.classList.add('wide');
                        } else if (index % 7 === 5) {
                            item.classList.add('big');
                        }
                        
                        const imgUrl = `assets/projects/${projectId}/${imgRelPath}`;
                        item.innerHTML = `<img src="${imgUrl}" alt="${project.title} Detail Image ${index + 1}">`;
                        
                        item.addEventListener('click', () => openLightbox(index));
                        galleryGrid.appendChild(item);
                    });
                    
                    gallerySec.style.display = 'block';
                    
                    // Observe new fade-in elements
                    if (window.IntersectionObserver) {
                        const observer = new IntersectionObserver((entries) => {
                            entries.forEach(entry => {
                                if (entry.isIntersecting) {
                                    entry.target.classList.add('visible');
                                }
                            });
                        }, { threshold: 0.05 });
                        galleryGrid.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
                    }
                }

                // Lightbox functions and event handlers
                const lightbox = document.getElementById('lightbox');
                const lightboxImg = lightbox.querySelector('.lightbox-img');
                const lightboxClose = lightbox.querySelector('.lightbox-close');
                const lightboxPrev = lightbox.querySelector('.lightbox-prev');
                const lightboxNext = lightbox.querySelector('.lightbox-next');
                const lightboxCounter = lightbox.querySelector('.lightbox-counter');
                
                let currentImgIndex = 0;
                
                function openLightbox(index) {
                    currentImgIndex = index;
                    updateLightboxImage();
                    lightbox.classList.add('active');
                    document.body.style.overflow = 'hidden';
                }
                
                function closeLightbox() {
                    lightbox.classList.remove('active');
                    document.body.style.overflow = '';
                }
                
                function updateLightboxImage() {
                    if (!project.images || project.images.length === 0) return;
                    const imgRelPath = project.images[currentImgIndex];
                    const imgUrl = `assets/projects/${projectId}/${imgRelPath}`;
                    lightboxImg.src = imgUrl;
                    lightboxCounter.textContent = `${currentImgIndex + 1} / ${project.images.length}`;
                }
                
                function nextImage() {
                    if (project.images && project.images.length > 0) {
                        currentImgIndex = (currentImgIndex + 1) % project.images.length;
                        updateLightboxImage();
                    }
                }
                
                function prevImage() {
                    if (project.images && project.images.length > 0) {
                        currentImgIndex = (currentImgIndex - 1 + project.images.length) % project.images.length;
                        updateLightboxImage();
                    }
                }
                
                lightboxClose.addEventListener('click', closeLightbox);
                lightboxNext.addEventListener('click', nextImage);
                lightboxPrev.addEventListener('click', prevImage);
                
                lightbox.addEventListener('click', (e) => {
                    if (e.target === lightbox || e.target.classList.contains('lightbox-content')) {
                        closeLightbox();
                    }
                });
                
                document.addEventListener('keydown', (e) => {
                    if (!lightbox.classList.contains('active')) return;
                    if (e.key === 'Escape') closeLightbox();
                    if (e.key === 'ArrowRight') nextImage();
                    if (e.key === 'ArrowLeft') prevImage();
                });

            } catch (err) {
                console.error("Initialization Failed:", err);
                document.getElementById('proj-title').textContent = "Project Not Found";
            }

            // Close logic
            document.getElementById('close-pano').addEventListener('click', () => {
                document.getElementById('pano-container').classList.remove('active');
                document.getElementById('close-pano').style.display = 'none';
                document.getElementById('main-header').style.display = 'block';
                if (window.screenfull && screenfull.isFullscreen) {
                    screenfull.exit();
                }
            });
        });
    </script>
</body>

</html>
